name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    # 1. Source Code & Version Control
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Continuous Integration
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated tests
      run: |
        pytest test_app.py

    # 3. Docker Build & Push (Uses Git commit SHA as unique tag)
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.sha }}

    # 4. Kubernetes Deployment
    - name: Set up Kubectl
      uses: azure/setup-kubectl@v3

    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBECONFIG }}

    - name: Deploy to Kubernetes Cluster
      run: |
        sed -i 's|DOCKER_USERNAME/calculator-app:IMAGE_TAG|${{ secrets.DOCKER_USERNAME }}/calculator-app:${{ github.sha }}|g' k8s/deployment.yaml
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml